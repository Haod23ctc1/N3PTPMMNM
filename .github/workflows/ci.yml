
name: CI - Website Noi That

on:
  push:
    branches:
      - main
      - feature/ci-cd
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore WebsiteNoiThat.sln

      - name: Install .NET Framework 4.5.2 reference assemblies
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net452 -Version 1.0.3 -OutputDirectory "$env:RUNNER_TEMP\ReferenceAssemblies"
          $refPath = Get-ChildItem "$env:RUNNER_TEMP\ReferenceAssemblies" -Recurse -Directory | Where-Object { $_.Name -eq "v4.5.2" } | Select-Object -First 1
          if (-not $refPath) {
            throw "Không tìm thấy thư mục reference assemblies v4.5.2"
          }
          "TargetFrameworkRootPath=$($refPath.Parent.Parent.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build solution
        run: msbuild WebsiteNoiThat.sln /p:Configuration=Release "/p:Platform=Any CPU" /p:FrameworkPathOverride="$env:RUNNER_TEMP\ReferenceAssemblies\Microsoft.NETFramework.ReferenceAssemblies.net452\build\.NETFramework\v4.5.2"
