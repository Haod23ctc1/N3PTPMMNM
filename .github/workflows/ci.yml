name: CI/CD - Website Noi That

on:
  push:
    branches:
      - main
      - feature/ci-cd
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cấp quyền cho GitHub Actions tự tạo bản Release mà không cần cấu hình thêm
permissions:
  contents: write

jobs:
  # ================= 1. CI: BUILD & ĐÓNG GÓI =================
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore WebsiteNoiThat.sln

      - name: Install .NET Framework 4.8 reference assemblies
        shell: pwsh
        run: |
          $packageDir = "$env:RUNNER_TEMP\ReferenceAssemblies"
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net48 -Version 1.0.3 -OutputDirectory $packageDir

          $reference = Get-ChildItem $packageDir -Recurse -Filter mscorlib.dll |
            Where-Object { $_.FullName -match '[\\/]v4\.8[\\/]' } |
            Select-Object -First 1

          if (-not $reference) {
            throw "Could not find .NET Framework 4.8 reference assemblies"
          }

          $frameworkRoot = Split-Path (Split-Path $reference.FullName -Parent) -Parent
          $frameworkRoot = Split-Path $frameworkRoot -Parent
          "TargetFrameworkRootPath=$frameworkRoot" | Out-File $env:GITHUB_ENV -Append

      - name: Build solution
        run: msbuild WebsiteNoiThat.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Package website for deployment
        shell: pwsh
        run: |
          $source = "WebsiteNoiThat"
          $destination = "$env:GITHUB_WORKSPACE\publish"

          if (Test-Path $destination) {
            Remove-Item $destination -Recurse -Force
          }

          New-Item -ItemType Directory -Path $destination | Out-Null
          Copy-Item "$source\*" $destination -Recurse -Force

          if (-not (Test-Path "$destination\WebsiteNoiThat.csproj")) {
            throw "Website project files were not found"
          }

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-noithat-release
          path: publish/
          if-no-files-found: error
          retention-days: 7

  # ================= 2. CD: CONTINUOUS DELIVERY (TỰ ĐỘNG PHÁT HÀNH BẢN RELEASE) =================
  cd-release:
    name: Continuous Delivery (CD)
    needs: build
    runs-on: ubuntu-latest
    # Chỉ chạy bước này khi code đã vào nhánh main
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Tải bản đóng gói từ bước CI
        uses: actions/download-artifact@v4
        with:
          name: website-noithat-release
          path: ./app-deploy

      - name: Nén sản phẩm thành file .zip
        run: |
          cd app-deploy && zip -r ../WebsiteNoiThat-v1.0.${{ github.run_number }}.zip . && cd ..

      - name: Tạo GitHub Release và xuất xưởng file cài đặt
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Website Nội Thất - Phiên bản Build #${{ github.run_number }}
          body: |
            ### 🚀 Quy trình Continuous Delivery (CD) hoàn tất!
            - **Trạng thái:** Tự động đóng gói và xuất xưởng thành công từ nhánh `main`.
            - **Commit:** `${{ github.sha }}`
            - **Tải về file bên dưới để triển khai/chạy thử.**
          files: WebsiteNoiThat-v1.0.${{ github.run_number }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}