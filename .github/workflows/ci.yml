
name: CI - Website Noi That

on:
  push:
    branches:
      - main
      - feature/ci-cd
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET Framework 4.5.2 targeting pack
        shell: pwsh
        run: |
          $url = "https://www.nuget.org/api/v2/package/Microsoft.NETFramework.ReferenceAssemblies.net452"
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net452 -Version 1.0.3 -OutputDirectory packages

      - name: Restore NuGet packages
        run: nuget restore WebsiteNoiThat.sln

      - name: Build solution
        run: msbuild WebsiteNoiThat.sln /p:Configuration=Release "/p:Platform=Any CPU"
