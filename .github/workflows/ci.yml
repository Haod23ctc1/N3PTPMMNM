name: CI - Website Noi That

on:
  push:
    branches:
      - main
      - feature/ci-cd
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore WebsiteNoiThat.sln

      - name: Install .NET Framework 4.5.2 reference assemblies
        shell: pwsh
        run: |
          $packageDir = "$env:RUNNER_TEMP\ReferenceAssemblies"
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net452 -Version 1.0.3 -OutputDirectory $packageDir

          $reference = Get-ChildItem $packageDir -Recurse -Filter mscorlib.dll |
            Where-Object { $_.FullName -match '[\\/]v4\.5\.2[\\/]' } |
            Select-Object -First 1

          if (-not $reference) {
            throw "Could not find .NET Framework 4.5.2 reference assemblies"
          }

          $frameworkRoot = Split-Path (Split-Path $reference.FullName -Parent) -Parent
          $frameworkRoot = Split-Path $frameworkRoot -Parent
          "TargetFrameworkRootPath=$frameworkRoot" | Out-File $env:GITHUB_ENV -Append

      - name: Build solution
        run: msbuild WebsiteNoiThat.sln /p:Configuration=Release "/p:Platform=Any CPU" "/p:TargetFrameworkRootPath=$env:TargetFrameworkRootPath"

      - name: Package website for deployment
        shell: pwsh
        run: |
          $source = "WebsiteNoiThat"
          $destination = "$env:GITHUB_WORKSPACE\publish"

          if (Test-Path $destination) {
            Remove-Item $destination -Recurse -Force
          }

          New-Item -ItemType Directory -Path $destination | Out-Null

          Copy-Item "$source\*" $destination -Recurse -Force

          if (-not (Test-Path "$destination\WebsiteNoiThat.csproj")) {
            throw "Website project files were not found"
          }

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-noithat-release
          path: publish/
          if-no-files-found: error
          retention-days: 7